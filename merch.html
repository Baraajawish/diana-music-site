<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merch — DIANA</title><meta name="description" content="DIANA — R&B artist from Atlanta. Debut album, merch and tour dates.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233B82F6'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='900' font-size='36' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css"></head><body>
<nav class="nav"><a class="logo" href="./index.html">DIANA</a><ul>
<li><a href="./index.html">Home</a></li><li><a href="./music.html">Music</a></li><li><a href="./merch.html" class="active" aria-current="page">Merch</a></li><li><a href="./tour.html">Tour</a></li>
<li><button class="cartbtn" id="cartbtn" aria-label="Open cart"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="badge" id="badge">0</span></button></li></ul></nav>

<section id="shop"><span class="sh">Official store</span><h2>Merch</h2><div class="grid" id="grid"></div></section>
<div class="qv" id="qv" role="dialog" aria-modal="true"><div class="box"><button class="x" onclick="document.getElementById('qv').classList.remove('open')" aria-label="Close">×</button><img id="qimg" alt=""><div class="b"><h3 id="qn" style="font-size:1.6rem;font-weight:900"></h3><p class="price" id="qp"></p><p id="qd" style="color:var(--muted);margin:12px 0 20px"></p><div class="row" id="qrow" style="display:flex;gap:10px;flex-wrap:wrap"></div></div></div></div>
<div class="drawer-bg" id="dbg"></div>
<aside class="drawer" id="drawer" aria-label="Cart"><header><h3>YOUR CART</h3><button class="x" onclick="closeCart()" aria-label="Close cart">×</button></header>
<div class="items" id="items"></div><footer><div class="sub"><span>Subtotal</span><span id="subtotal">$0.00</span></div><button class="btn" id="checkout" onclick="checkout()"><span class="lock">🔒</span> Checkout</button><p class="demo">Secure checkout by Stripe.</p></footer></aside>
<div class="toast" id="toast" role="status"></div>
<footer class="site"><span>© 2026 DIANA · Atlanta</span><span>Debut album out now</span></footer>
<script src="./cart.js"></script><script>
const sizeSel=(P,id)=>P.sizes&&P.sizes.length>1?`<select id="${id}" aria-label="Size">${P.sizes.map(s=>`<option>${s}</option>`).join('')}</select>`:'';
const sz=(P,id)=>P.sizes?(P.sizes.length>1?document.getElementById(id).value:P.sizes[0]):null;
document.getElementById('grid').innerHTML=PRODUCTS.map(P=>`<article class="prod"><div class="ph" onclick="qview('${P.id}')"><img src="./images/${P.img}.jpg" alt="${P.n}">${P.badge?`<span class="tagb ${P.badge[1]}">${P.badge[0]}</span>`:''}</div><div class="b"><h3>${P.n}</h3><p class="price">$${P.p}</p><div class="row">${sizeSel(P,'s-'+P.id)}<button class="btn outline" onclick="add('${P.id}',sz(PRODUCTS.find(x=>x.id==='${P.id}'),'s-${P.id}'))">Add to Cart</button><button class="btn" onclick="buyNow('${P.id}',sz(PRODUCTS.find(x=>x.id==='${P.id}'),'s-${P.id}'))"><span class="lock">🔒</span> Buy Now</button></div></div></article>`).join('');
function qview(id){const P=PRODUCTS.find(x=>x.id===id);document.getElementById('qimg').src='./images/'+P.img+'.jpg';document.getElementById('qn').textContent=P.n;document.getElementById('qp').textContent='$'+P.p;document.getElementById('qd').textContent=P.d;
 document.getElementById('qrow').innerHTML=sizeSel(P,'qs')+`<button class="btn" onclick="add('${P.id}',sz(PRODUCTS.find(x=>x.id==='${P.id}'),'qs'));document.getElementById('qv').classList.remove('open')">Add to Cart</button>`;document.getElementById('qv').classList.add('open');}
</script></body></html>
